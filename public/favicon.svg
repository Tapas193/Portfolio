<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .plate { fill: #ffffff; stroke: #d6d3cc; }
    .mark { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #000000; stroke: #333333; }
      .mark { fill: #ffffff; }
    }
  </style>
  <rect class="plate" x="2" y="2" width="60" height="60" rx="14" stroke-width="2" />
  <text
    class="mark"
    x="50%"
    y="54%"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-weight="700"
    font-size="26"
    text-anchor="middle"
    dominant-baseline="middle"
  >TM</text>
</svg>
